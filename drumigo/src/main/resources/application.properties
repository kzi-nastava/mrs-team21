spring.application.name=drumigo

# Fill these values in application-dev.properties (gitignored) for local dev.
mapbox.api.key=
app.frontend.url=

# Optional: base URL for driver activation link in email. If set, used instead of app.frontend.url.
# - Custom scheme (mobile app): drumigo://activate-driver  -> drumigo://activate-driver/TOKEN
# - Ngrok (backend exposed): https://YOUR-SUBDOMAIN.ngrok-free.app  -> https://.../activate-driver/TOKEN
#   (Mobile app has intent filters for *ngrok.io and *ngrok-free.app so the link opens the app.)
# Leave empty to use app.frontend.url (e.g. http://localhost:4200/activate-driver/TOKEN).
app.driver-activation.link=

server.address=0.0.0.0
server.port=8080
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

jwt.secret=
jwt.expiration=

spring.profiles.active=dev

# MySQL configuration (override in application-dev.properties)
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Maintenance endpoint basic auth (set in application-dev.properties for local dev, e.g. admin/admin).
# Then: POST http://localhost:8080/api/maintenance/reset with Basic Auth to run the seed.
maintenance.basic.username=
maintenance.basic.password=
app.maintenance.seed-script=classpath:db/seed/mysql-seed.sql

# Profile picture uploads (relative to working directory)
app.uploads.profile-dir=uploads/profile

# Allow multipart uploads up to 6MB (profile pictures)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
