spring.application.name=drumigo

# Fill these values in application-dev.properties (gitignored) for local dev.
mapbox.api.key=
app.frontend.url=

server.address=0.0.0.0
server.port=8080
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

jwt.secret=
jwt.expiration=

spring.profiles.active=dev

# MySQL configuration (override in application-dev.properties)
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Maintenance endpoint basic auth (override in application-dev.properties)
maintenance.basic.username=
maintenance.basic.password=
app.maintenance.seed-script=classpath:db/seed/mysql-seed.sql
