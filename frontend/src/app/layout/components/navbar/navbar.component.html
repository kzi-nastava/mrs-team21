<aside class="sidebar">
  <!-- Logo -->
  <a routerLink="/landing" class="logo" aria-label="Drumigo Home">
    <div class="logo-icon">
      <img src="/images/logo/logo-blue-v2.svg" alt="Drumigo" />
    </div>
    <span class="logo-text">Drumigo</span>
  </a>

  <!-- Navigation Sections -->
  @for (sectionKey of getSectionKeys(); track sectionKey) {
    <nav class="nav-section">
      <div class="nav-label">{{ sectionLabels[sectionKey] }}</div>
      <div class="nav-items">
        @for (item of groupedNavItems.get(sectionKey); track $index) {
          <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              [innerHTML]="getIconSvg(item.icon)"
            ></svg>
            {{ item.label }}
          </a>
        }
      </div>
    </nav>
  }

  <!-- Spacer -->
  <div class="nav-spacer"></div>

  <!-- User Profile -->
  <div class="user-profile">
    <div class="user-avatar">{{ user.initials }}</div>
    <div class="user-info">
      <div class="user-name">{{ user.name }}</div>
      <div class="user-role">{{ user.role }}</div>
    </div>
  </div>
</aside>
