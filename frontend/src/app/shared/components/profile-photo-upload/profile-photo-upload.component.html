<!-- Unified Photo Upload - Click to Upload Design -->
<div class="profile-photo-upload">
  <div
    class="avatar-container"
    [class.disabled]="disabled"
    (click)="triggerFileInput(fileInput)"
    role="button"
    [attr.aria-label]="'Upload profile photo'"
    [tabindex]="disabled ? -1 : 0"
    (keydown.enter)="triggerFileInput(fileInput)"
    (keydown.space)="triggerFileInput(fileInput)"
  >
    <!-- Avatar Image -->
    <div class="avatar" [style.width.px]="size" [style.height.px]="size">
      <img [src]="displayUrl" alt="Profile photo" (error)="onImageError($event)" />
    </div>

    <!-- Upload Overlay (shows on hover) -->
    <div class="upload-overlay">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="12" cy="14" r="4" stroke="white" stroke-width="2" />
      </svg>
      <span class="upload-text">Click to upload</span>
    </div>

    <!-- Hidden File Input -->
    <input
      #fileInput
      type="file"
      [accept]="acceptedTypes"
      (change)="onFileSelected($event)"
      [disabled]="disabled"
      hidden
      aria-hidden="true"
    />
  </div>

  <!-- Error Message -->
  @if (errorMessage) {
    <div class="error-message">{{ errorMessage }}</div>
  }
</div>
